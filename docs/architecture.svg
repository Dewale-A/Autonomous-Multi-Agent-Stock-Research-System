  <text x="150" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Researcher</text>
  <text x="150" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Market news scanning</text>
  <text x="150" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Trending tickers</text>
  <text x="150" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Sector performance</text>
