  <text x="300" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#166534">stock_fundamentals</text>
  <text x="300" y="473" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#22c55e">Financial ratios</text>
  
  <rect x="230" y="490" width="140" height="35" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="300" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#166534">compare_stocks</text>
  <text x="300" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#22c55e">Side-by-side compare</text>
  
  <!-- ML Tools -->
  <rect x="390" y="445" width="140" height="35" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="460" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#5b21b6">stock_prediction</text>
  <text x="460" y="473" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#8b5cf6">Directional signals</text>
  
  <rect x="390" y="490" width="140" height="35" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="460" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#5b21b6">anomaly_detection</text>
  <text x="460" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#8b5cf6">Pattern detection</text>

  <!-- Historical Tools -->
  <rect x="550" y="445" width="140" height="35" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="620" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#a16207">historical_data</text>
  <text x="620" y="473" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">Price history</text>
  
  <rect x="550" y="490" width="140" height="35" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="620" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#a16207">sector_performance</text>
  <text x="620" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f59e0b">ETF analysis</text>

  <!-- Output Section -->
