  <text x="730" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Selects top 3 stocks</text>
  <text x="730" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Defines thesis &amp; risks</text>
  <rect x="680" y="275" width="100" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
