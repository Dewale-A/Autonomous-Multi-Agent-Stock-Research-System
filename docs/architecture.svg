  <text x="150" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1">PHASE 1: RESEARCH</text>
  
  <rect x="300" y="60" width="280" height="25" rx="4" fill="#dcfce7"/>
  <text x="440" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">PHASE 2: ANALYSIS</text>
  
  <rect x="630" y="60" width="180" height="25" rx="4" fill="#fef3c7"/>
  <text x="720" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a16207">PHASE 3: STRATEGY</text>
  
