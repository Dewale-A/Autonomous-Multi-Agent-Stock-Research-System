  <text x="400" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Fundamental analysis</text>
  <text x="400" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Valuation ratios</text>
  <text x="400" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Growth &amp; stability</text>
  <rect x="350" y="205" width="100" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="400" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">GPT-4o-mini</text>
  
