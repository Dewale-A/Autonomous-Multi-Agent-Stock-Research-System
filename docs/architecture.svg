  <text x="975" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">OUTPUT</text>
  
  <rect x="820" y="445" width="310" height="80" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="975" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#be185d">daily_stock_report_YYYY-MM-DD.md</text>
  <text x="975" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#db2777">Market Overview | Key Drivers | Featured Stocks</text>
  <text x="975" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#db2777">Fundamental Ratings | Model Notes | Disclaimer</text>

  <!-- Footer badges -->
  <rect x="350" y="570" width="80" height="25" rx="12" fill="#1e293b"/>
  <text x="390" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">CrewAI</text>
  
  <rect x="440" y="570" width="100" height="25" rx="12" fill="#10a37f"/>
  <text x="490" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">OpenAI GPT</text>
  
  <rect x="550" y="570" width="100" height="25" rx="12" fill="#d97706"/>
  <text x="600" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">Claude Haiku</text>
  
  <rect x="660" y="570" width="100" height="25" rx="12" fill="#6366f1"/>
  <text x="710" y="587" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">yfinance</text>
